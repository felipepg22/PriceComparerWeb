<article class="offer-card">
  <div class="offer-card__rank">{{ rank }}</div>

  <div class="offer-card__main">
    @if (rank === 1 && bestOverallLabel) {
      <p class="offer-card__best">{{ bestOverallLabel }}</p>
    }
    <p class="offer-card__seller">{{ offer.sellerLabel }}</p>
    <h2>{{ offer.title }}</h2>
    @if (rank === 1 && bestOverallExplanation) {
      <p class="offer-card__explanation">{{ bestOverallExplanation }}</p>
    }
  </div>

  <div class="offer-card__side">
    <p class="offer-card__price">{{ offer.displayPrice }}</p>
    <div class="offer-card__actions">
      <a [href]="offer.url" target="_blank" rel="noopener">{{ offer.openOfferLabel }}</a>
      <button type="button" class="offer-card__email" (click)="emailRequested.emit(offer)">{{ emailOfferLabel }}</button>
    </div>
  </div>
</article>
