<form class="search-panel" [formGroup]="form" (ngSubmit)="submitted.emit()">
  <div class="search-panel__intro">
    <p>{{ labels.searchIntroTitle }}</p>
    <span>{{ labels.searchIntroDescription }}</span>
  </div>

  <div class="search-panel__controls">
    <div class="search-panel__field search-panel__field--query">
      <label for="query">{{ labels.searchProductLabel }}</label>
      <input
        id="query"
        type="search"
        formControlName="query"
        [placeholder]="labels.searchProductPlaceholder"
        autocomplete="off"
      />
    </div>

    <div class="search-panel__field">
      <label for="currency">{{ labels.searchCurrencyFilterLabel }}</label>
      <select id="currency" formControlName="currency">
        <option value="">{{ labels.searchAnyCurrency }}</option>
        @for (currency of currencyOptions; track currency.code) {
          <option [value]="currency.code">{{ currency.label }}</option>
        }
      </select>
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? labels.searchingButton : labels.searchButton }}
    </button>
  </div>
</form>
