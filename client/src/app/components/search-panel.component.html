<form class="search-panel" [formGroup]="form" (ngSubmit)="submitted.emit()">
  <div class="search-panel__controls">
    <div class="search-panel__field search-panel__field--query">
      <label class="search-panel__label" for="query">{{ labels.searchProductLabel }}</label>
      <input
        id="query"
        type="search"
        formControlName="query"
        [placeholder]="labels.searchProductPlaceholder"
        [attr.aria-describedby]="form.controls['query'].touched && form.controls['query'].invalid ? 'query-error' : null"
        [attr.aria-invalid]="form.controls['query'].touched && form.controls['query'].invalid"
        autocomplete="off"
      />
      @if (form.controls['query'].touched && form.controls['query'].invalid) {
        <p id="query-error" class="search-panel__error" role="alert">{{ labels.validationDescription }}</p>
      }
    </div>

    <div class="search-panel__field search-panel__field--currency">
      <span id="currency-label" class="search-panel__label">{{ labels.searchCurrencyFilterLabel }}</span>
      <div id="currency" class="currency-picker" role="radiogroup" aria-labelledby="currency-label" [attr.aria-describedby]="form.controls['currency'].invalid ? 'currency-error' : null">
        @for (currency of currencyOptions; track currency.code) {
          <label class="currency-picker__option">
            <input class="currency-picker__input" type="radio" name="currency" formControlName="currency" [value]="currency.code" [attr.data-currency]="currency.code" />
            <span class="currency-picker__content">{{ currency.label }}</span>
          </label>
        }
      </div>
      @if (form.controls['currency'].invalid) {
        <p id="currency-error" class="search-panel__error" role="alert">{{ labels.searchCurrencyRequired }}</p>
      }
    </div>

    <button class="search-panel__submit" type="submit" [disabled]="loading || form.invalid">
      {{ loading ? labels.searchingButton : labels.searchButton }}
    </button>
  </div>
</form>
